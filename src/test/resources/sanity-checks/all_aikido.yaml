# Needs Aikido credentials, so it is on the skip list in kestra-io/sanity-checks.
id: all_aikido
namespace: company.security

tasks:
  - id: loop
    type: io.kestra.plugin.core.flow.Loop
    values:
      - aikido_scan_repository
      - aikido_get_compliance_report
    tasks:
      - id: subflow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: "{{ item.value }}"
        namespace: "{{ flow.namespace }}"
